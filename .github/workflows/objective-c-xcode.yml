name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Personal-Expense-Tracker

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
      - name: Build (verbose)
        run: |
          xcodebuild clean build \
          -project Personal-Expense-Tracker-SwiftUI-App/Personal-Expense-Tracker.xcodeproj \
          -scheme "Personal-Expense-Tracker" \
          -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log
          # Print only errors and warnings for clarity
          grep -E "error:|warning:|BUILD FAILED" build.log || true
